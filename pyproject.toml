[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "counterparty-data-platform"
version = "0.1.0"
description = "Référentiel contrepartie gouverné : ingestion GLEIF, contrôles qualité et golden record avec Airflow et dbt."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Omar Ouchchen" }]
dependencies = [
    "requests>=2.31",
    "duckdb==1.5.6",
    "dbt-core>=1.10,<1.13",
    "dbt-duckdb==1.11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dbt/target", "dbt/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
