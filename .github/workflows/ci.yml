name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer le projet
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests unitaires
        run: pytest

      - name: Pipeline complet sur l'échantillon (hors ligne)
        run: python -m cdp.pipeline --from-sample
