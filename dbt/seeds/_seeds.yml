version: 2

seeds:
  - name: dq_rule_catalog
    description: >
      Catalogue des règles qualité (approche rules-as-data) : dimension, sévérité, caractère
      bloquant et type d'anomalie que la règle doit détecter.
    config:
      column_types:
        is_blocking: boolean
    columns:
      - name: rule_name
        data_tests: [unique, not_null]
      - name: dimension
        data_tests:
          - accepted_values:
              arguments:
                values: [completude, validite, coherence, unicite]
