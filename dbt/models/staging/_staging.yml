version: 2

models:
  - name: stg_gleif__lei_records
    description: Une ligne par LEI, dernière version connue, champs utiles extraits du JSON GLEIF.
    columns:
      - name: lei
        data_tests:
          - unique
          - not_null
          - valid_lei
      - name: legal_country
        data_tests:
          - not_null
      - name: registration_status
        description: Statut de l'enregistrement LEI (ISSUED, LAPSED...). Un LEI LAPSED n'est plus renouvelé.
        data_tests:
          - accepted_values:
              arguments:
                values: [ISSUED, LAPSED, PENDING_TRANSFER, PENDING_ARCHIVAL, MERGED, RETIRED,
                         ANNULLED, CANCELLED, DUPLICATE, TRANSFERRED]
              config:
                severity: warn
      - name: last_updated_at
        data_tests:
          - not_null

  - name: stg_internal__counterparties
    description: Fiches contreparties du système interne, nettoyées (trim, majuscules, vides en NULL).
    columns:
      - name: counterparty_id
        data_tests:
          - unique
          - not_null
      - name: onboarding_date
        data_tests:
          - not_null

  - name: stg_internal__anomalies_truth
    description: Anomalies injectées par le générateur, une au plus par fiche.
    columns:
      - name: counterparty_id
        data_tests:
          - unique
          - relationships:
              arguments:
                to: ref('stg_internal__counterparties')
                field: counterparty_id
      - name: anomaly_type
        data_tests:
          - accepted_values:
              arguments:
                values: [missing_mandatory_field, missing_lei, invalid_lei_checksum,
                         lei_not_found, country_mismatch, duplicate_record]
